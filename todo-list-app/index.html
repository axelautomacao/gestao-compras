<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts - Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .app-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .task-item.completed span {
            text-decoration: line-through;
            color: #6c757d;
        }
        .task-item span {
            flex-grow: 1;
        }
        .material-icons {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React and ReactDOM from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [tasks, setTasks] = useState([]);
            const [inputValue, setInputValue] = useState('');
            const [filter, setFilter] = useState('all');

            // Load tasks from localStorage on initial render
            useEffect(() => {
                const storedTasks = JSON.parse(localStorage.getItem('tasks'));
                if (storedTasks) {
                    setTasks(storedTasks);
                }
            }, []);

            // Save tasks to localStorage whenever they change
            useEffect(() => {
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }, [tasks]);

            const handleAddTask = (e) => {
                e.preventDefault();
                if (inputValue.trim() === '') return;
                const newTask = { id: Date.now(), text: inputValue, completed: false };
                setTasks([...tasks, newTask]);
                setInputValue('');
            };

            const handleToggleTask = (id) => {
                setTasks(tasks.map(task => 
                    task.id === id ? { ...task, completed: !task.completed } : task
                ));
            };

            const handleDeleteTask = (id) => {
                setTasks(tasks.filter(task => task.id !== id));
            };

            const filteredTasks = tasks.filter(task => {
                if (filter === 'active') return !task.completed;
                if (filter === 'completed') return task.completed;
                return true; // 'all'
            });

            return (
                <div className="app-container">
                    <h1 className="mb-4 text-center">Gerenciador de Tarefas</h1>
                    
                    <form onSubmit={handleAddTask} className="d-flex mb-4">
                        <input 
                            type="text" 
                            className="form-control me-2" 
                            value={inputValue} 
                            onChange={(e) => setInputValue(e.target.value)}
                            placeholder="Adicionar nova tarefa..."
                        />
                        <button type="submit" className="btn btn-primary">Adicionar</button>
                    </form>

                    <div className="d-flex justify-content-center mb-4">
                        <div className="btn-group">
                            <button onClick={() => setFilter('all')} className={`btn ${filter === 'all' ? 'btn-primary' : 'btn-outline-primary'}`}>Todas</button>
                            <button onClick={() => setFilter('active')} className={`btn ${filter === 'active' ? 'btn-primary' : 'btn-outline-primary'}`}>Ativas</button>
                            <button onClick={() => setFilter('completed')} className={`btn ${filter === 'completed' ? 'btn-primary' : 'btn-outline-primary'}`}>Concluídas</button>
                        </div>
                    </div>

                    <ul className="list-group">
                        {filteredTasks.map(task => (
                            <li key={task.id} className="list-group-item task-item">
                                <i className="material-icons" onClick={() => handleToggleTask(task.id)}>
                                    {task.completed ? 'check_box' : 'check_box_outline_blank'}
                                </i>
                                <span className={task.completed ? 'completed' : ''}>{task.text}</span>
                                <i className="material-icons text-danger" onClick={() => handleDeleteTask(task.id)}>
                                    delete
                                </i>
                            </li>
                        ))}
                    </ul>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
